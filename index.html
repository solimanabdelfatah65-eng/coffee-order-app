<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
  (() => {
    const hash = window.location.hash;
    if (hash === '#customer-step') {
      const target = new URL('https://al-fouad.vercel.app/');
      target.search = window.location.search;
      target.hash = hash;
      window.location.replace(target.href);
    }
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كافيه الفؤاد | Cafe Al Fouad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@700;800;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F7F1E7; --surface:#FFFDF9; --line:#E8DCC8; --ink:#1C120D; --muted:#7A614B;
    --accent:#C69763; --dark:#2A1A12; --cream:#E7D7C2;
    --green:#4f9670; --red:#c46a5a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{font-family:'Cairo',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; overflow-x:hidden;}

  /* ===== حركات عامة ===== */
  @keyframes fadeUp{from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-10px) rotate(1.2deg);}}
  @keyframes popIn{0%{opacity:0; transform:scale(.7) translateY(40px);} 100%{opacity:1; transform:scale(1) translateY(0);}}
  @keyframes slideDown{from{opacity:0; transform:translateY(-30px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pulseNew{0%,100%{box-shadow:0 0 0 0 rgba(168,132,98,.55);} 50%{box-shadow:0 0 0 12px rgba(168,132,98,0);}}
  @keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}
  @keyframes slideUpBar{from{transform:translateY(100%);} to{transform:translateY(0);}}

  /* ===== النافبار ===== */
  nav{position:sticky; top:0; z-index:20; background:rgba(246,239,228,.92); backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px;
      animation:slideDown .5s both;}
  .navbrand{display:flex; align-items:center; gap:10px;}
  .navbrand .logo{width:38px; height:38px; flex:none; transition:transform .3s;}
  .navbrand:hover .logo{transform:rotate(-8deg) scale(1.08);}
  .navbrand .name{font-weight:800; font-size:18px; color:var(--ink); line-height:1.1;}
  .navbrand .name small{display:block; font-size:10px; color:var(--dark); font-weight:600; letter-spacing:2px;}
  .navside{display:flex; align-items:center; gap:8px;}
  .tablepill{background:var(--ink); color:var(--bg); border-radius:20px; padding:5px 14px; font-size:13px; font-weight:700; animation:popIn .5s .2s both;}
  .langbtn{background:none; border:1.5px solid var(--dark); color:var(--dark); border-radius:20px; padding:6px 14px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:all .25s;}
  .langbtn:hover{background:var(--dark); color:var(--bg); transform:scale(1.05);}
  .langbtn:active{transform:scale(.95);}

  /* ===== الهيرو ===== */
  .hero{max-width:1000px; margin:0 auto; padding:46px 22px 30px; display:grid; grid-template-columns:1.2fr 1fr; gap:30px; align-items:center;}
  .hero > div:first-child > *{animation:fadeUp .7s both;}
  .hero > div:first-child > *:nth-child(2){animation-delay:.12s;}
  .hero > div:first-child > *:nth-child(3){animation-delay:.24s;}
  .hero > div:first-child > *:nth-child(4){animation-delay:.36s;}
  .eyebrow{color:var(--dark); font-size:12px; font-weight:700; letter-spacing:3px; margin-bottom:12px;}
  .hero h1{font-size:clamp(30px,6vw,52px); font-weight:800; line-height:1.25; color:var(--ink);}
  .hero h1 em{font-family:'Playfair Display',serif; font-style:italic; font-weight:600;
    background:linear-gradient(100deg,var(--accent) 30%,var(--dark) 50%,var(--accent) 70%); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shimmer 4s linear infinite;}
  .hero p{color:var(--muted); margin:14px 0 22px; line-height:1.9; font-size:15px; max-width:42ch;}
  .cta{display:inline-block; background:var(--ink); color:var(--bg); text-decoration:none; border:none;
       border-radius:30px; padding:13px 30px; font-family:inherit; font-size:16px; font-weight:800; cursor:pointer;
       box-shadow:0 8px 22px rgba(58,36,24,.25); transition:all .25s;}
  .cta:hover{background:var(--dark); transform:translateY(-2px) scale(1.03); box-shadow:0 12px 28px rgba(107,74,46,.3);}
  .cta:active{transform:scale(.97);}
  .hero .art{animation:popIn .8s .2s both;}
  .hero .art img{width:100%; max-width:340px; aspect-ratio:1/1.05; object-fit:cover; display:block; margin-inline:auto;
       border-radius:46% 54% 52% 48% / 44% 46% 54% 56%; border:6px solid var(--surface);
       box-shadow:0 22px 44px rgba(58,36,24,.22); animation:floaty 5s ease-in-out infinite;}
  @media (max-width:720px){ .hero{grid-template-columns:1fr; text-align:center; padding-top:34px;} .hero p{margin-inline:auto;} .hero .art img{max-width:250px;} }

  /* ===== المنيو ===== */
  .menu{max-width:1000px; margin:0 auto; padding:26px 22px 130px;}
  .menu h2{font-size:26px; font-weight:800; color:var(--ink); margin-bottom:4px; animation:fadeUp .6s both;}
  .menu .sub{color:var(--dark); font-size:13px; letter-spacing:2px; margin-bottom:20px; animation:fadeUp .6s .1s both;}
  .menu-tools{margin:0 0 22px;}
  .searchbox{position:relative;max-width:720px;margin:0 auto 14px;}
  .searchbox:focus-within{filter:drop-shadow(0 5px 13px rgba(198,151,99,.13));}
  .searchbox input{width:100%;height:54px;padding:10px 48px;border:1px solid rgba(198,151,99,.32);border-radius:18px;background:rgba(255,253,249,.78);color:var(--ink);font:600 15px 'Cairo',sans-serif;outline:none;box-shadow:0 8px 24px rgba(28,18,13,.05);transition:border-color .2s,box-shadow .2s;}
  .searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(198,151,99,.12),0 8px 24px rgba(28,18,13,.05);}
  .searchbox input::placeholder{color:#927e6d;font-weight:400;}
  .search-icon{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#8a623e;pointer-events:none;}
  .search-clear{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:rgba(198,151,99,.15);color:var(--dark);font:700 22px/1 'Cairo',sans-serif;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .2s,background .2s,transform .2s;}
  .search-clear.visible{opacity:1;visibility:visible;}
  .search-clear:hover{background:rgba(198,151,99,.28);transform:translateY(-50%) scale(1.06);}
  .category-pills{display:flex;align-items:center;gap:9px;overflow-x:auto;padding:3px 1px 9px;scrollbar-width:thin;scrollbar-color:rgba(198,151,99,.55) transparent;-webkit-overflow-scrolling:touch;}
  .category-pill{display:inline-flex;align-items:center;gap:8px;flex:none;min-height:40px;padding:7px 14px;border:1px solid rgba(198,151,99,.27);border-radius:999px;background:rgba(255,253,249,.62);color:#67472d;font:700 13px 'Cairo',sans-serif;cursor:pointer;white-space:nowrap;transition:color .22s,background .22s,border-color .22s,box-shadow .22s,transform .22s;}
  .category-pill:hover{transform:translateY(-2px);border-color:rgba(198,151,99,.6);background:rgba(255,253,249,.92);}
  .category-pill.active{color:#fff;background:linear-gradient(135deg,#3b281d,#1c120d);border-color:transparent;box-shadow:0 6px 16px rgba(28,18,13,.17);}
  .category-count{min-width:21px;height:21px;padding:1px 6px;border-radius:999px;background:rgba(198,151,99,.17);color:#79532f;font-size:11px;line-height:19px;text-align:center;font-variant-numeric:tabular-nums;}
  .category-pill.active .category-count{background:rgba(255,255,255,.16);color:#f1d2aa;}
  .menu-empty{grid-column:1/-1;padding:42px 18px;border:1px dashed rgba(198,151,99,.36);border-radius:20px;background:rgba(255,253,249,.55);text-align:center;color:var(--muted);}
  .menu-empty p{margin-bottom:13px;line-height:1.8;}
  .show-all-btn{border:0;background:transparent;color:#79532f;font:800 14px 'Cairo',sans-serif;text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:12px;
        display:flex; flex-direction:column; gap:12px; cursor:pointer;
        transition:transform .2s, box-shadow .2s, border-color .2s;
        animation:fadeUp .55s both; animation-delay:calc(var(--i,0) * 70ms);}
  .card:hover{transform:translateY(-5px) scale(1.015); box-shadow:0 16px 32px rgba(58,36,24,.16); border-color:var(--accent);}
  .card:active{transform:scale(.98);}
  .cimg{width:100%; height:150px; object-fit:cover; border-radius:14px; display:block; background:var(--line); transition:transform .3s;}
  .card:hover .cimg{transform:scale(1.04);}
  .card .topline{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:0 4px;}
  .card .nm{font-weight:700; font-size:17px; color:var(--ink);}
  .card .alt{font-size:12px; color:var(--muted); margin-top:2px;}
  .price{background:var(--bg); border:1px solid var(--accent); color:var(--dark); border-radius:14px; padding:4px 12px; font-weight:800; font-size:14px; white-space:nowrap;}
  .stepper{display:flex; align-items:center; justify-content:space-between; background:var(--bg); border:1px solid var(--line); border-radius:30px; padding:5px;}
  .stepper button{width:34px; height:34px; border-radius:50%; border:none; background:var(--cream); color:var(--ink); font-size:18px; cursor:pointer; font-family:inherit; line-height:1; transition:all .2s;}
  .stepper button:hover{background:var(--dark); color:var(--bg); transform:scale(1.1);}
  .stepper button:active{transform:scale(.88);}
  .stepper span{font-weight:800; font-size:16px; min-width:24px; text-align:center; transition:transform .15s;}
  .stepper span.bump{transform:scale(1.5); color:var(--dark);}

  /* ===== مودال الصنف ===== */
  .overlay{position:fixed; inset:0; z-index:50; background:rgba(58,36,24,.45); backdrop-filter:blur(6px);
           display:none; align-items:flex-end; justify-content:center; padding:0;}
  @media (min-width:600px){ .overlay{align-items:center; padding:24px;} }
  .overlay.open{display:flex; animation:fadeIn .25s both;}
  .overlay.closing{animation:fadeIn .2s reverse both;}
  .mcard{background:var(--surface); border:1px solid var(--line); border-radius:26px 26px 0 0;
         width:100%; max-width:440px; max-height:92vh; overflow-y:auto; padding:16px 18px 28px; text-align:center; position:relative;
         box-shadow:0 -12px 44px rgba(58,36,24,.3);}
  @media (min-width:600px){ .mcard{border-radius:26px;} }
  .overlay.open .mcard{animation:popIn .45s cubic-bezier(.2,1.3,.4,1) both;}
  .overlay.closing .mcard{animation:popIn .25s reverse both;}
  .mclose{position:absolute; top:26px; inset-inline-end:26px; z-index:2; width:38px; height:38px; border-radius:50%; border:none;
          background:rgba(58,36,24,.75); color:#fff; font-size:20px; cursor:pointer; transition:all .25s; line-height:1;}
  .mclose:hover{background:var(--red); transform:rotate(90deg);}
  .mimg{width:100%; height:250px; object-fit:cover; border-radius:18px; display:block; background:var(--line);
        animation:fadeIn .5s both;}
  .mnm{font-size:24px; font-weight:800; color:var(--ink); margin-top:14px;}
  .malt{color:var(--muted); font-size:14px; margin-bottom:10px;}
  .mprice{display:inline-block; background:var(--bg); border:1px solid var(--accent); color:var(--dark); border-radius:16px; padding:5px 20px; font-weight:800; font-size:18px; margin-bottom:16px;}
  .mstep{max-width:230px; margin:0 auto 18px;}

  /* ===== سلة الطلب ===== */
  .cartbar{position:fixed; bottom:0; left:0; right:0; z-index:30; display:none;
           background:rgba(58,36,24,.97); padding:14px 20px;
           animation:slideUpBar .35s both; border-radius:22px 22px 0 0;}
  .cartbar.show{display:block;}
  .cartbar .inner{max-width:1000px; margin:0 auto; display:flex; align-items:center; gap:14px;}
  .cartbar .total{font-weight:800; font-size:17px; white-space:nowrap; color:var(--bg);}
  .cartbar .total small{color:var(--cream); display:block; font-size:11px; font-weight:600;}
  .cartbar .cta{flex:1; padding:12px; background:var(--accent); color:var(--ink);}
  .cartbar .cta:hover{background:var(--cream);}

  /* ===== عام ===== */
  .center{text-align:center; padding:70px 22px; animation:fadeUp .5s both;}
  .center h2{color:var(--ink); margin-bottom:12px; font-size:24px;}
  .center p{color:var(--muted); line-height:1.9;}
  .err{background:#f8e3dd; border:1px solid var(--red); color:#9c4a3a; border-radius:12px; padding:10px 14px; margin-bottom:14px; display:none; font-size:14px;}
  footer{border-top:1px solid var(--line); padding:20px; text-align:center; color:var(--muted); font-size:13px;}

  /* ===== الكاشير ===== */
  .pinbox{max-width:330px; margin:90px auto; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:30px; text-align:center; animation:popIn .5s both; box-shadow:0 16px 36px rgba(58,36,24,.12);}
  .pinbox h2{color:var(--ink); margin-bottom:6px;}
  .pinbox .hint{color:var(--dark); font-size:12px; margin-bottom:6px;}
  .pinbox input{width:100%; padding:12px; font-size:24px; text-align:center; letter-spacing:10px; border-radius:12px;
                border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-family:inherit; margin:12px 0; outline:none; transition:border-color .2s;}
  .pinbox input:focus{border-color:var(--dark);}
  .wrap{max-width:760px; margin:0 auto; padding:20px 18px 60px;}
  .order{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-bottom:14px;
         border-right:5px solid var(--accent); animation:fadeUp .4s both; box-shadow:0 6px 18px rgba(58,36,24,.08);}
  .order.newflash{animation:fadeUp .4s both, pulseNew 1.6s 3;}
  .order.ready{border-right-color:var(--green); opacity:.8;}
  .order .head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
  .order .tnum{display:inline-flex;align-items:center;font-weight:800;font-size:clamp(19px,4vw,25px);color:#fff;background:linear-gradient(135deg,#9b6036,#633719);padding:7px 16px;border-radius:14px;box-shadow:0 6px 16px rgba(99,55,25,.22);}
  .order.newflash .tnum{animation:tableAlert .8s ease-in-out 3;}
  @keyframes tableAlert{0%,100%{transform:scale(1);box-shadow:0 6px 16px rgba(99,55,25,.22);}50%{transform:scale(1.08);box-shadow:0 0 0 7px rgba(198,151,99,.25),0 10px 24px rgba(99,55,25,.3);}}
  .order .time{color:var(--muted); font-size:13px;}
  .badge{font-size:12px; padding:3px 12px; border-radius:14px; background:var(--ink); color:var(--bg); font-weight:800;}
  .badge.ready{background:var(--green);}
  .order .lines{margin:10px 0; line-height:2.1; font-size:15px; color:var(--ink);}
  .order .lines span{color:var(--muted); font-size:13px;}
  .order .ototal{font-weight:800; border-top:1px dashed var(--line); padding-top:10px; color:var(--dark);}
  .order .actions{display:flex; gap:8px; margin-top:12px;}
  .order .actions button{flex:1; padding:11px; border-radius:12px; border:none; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer; transition:all .2s;}
  .order .actions button:hover{transform:translateY(-2px);}
  .btn-ready{background:var(--green); color:#fff;}
  .btn-paid{background:var(--bg); color:var(--ink); border:1px solid var(--line) !important;}
  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:15px; animation:fadeIn .5s both;}

  /* ===== QR ===== */
  .qrgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; max-width:900px; margin:0 auto; padding:0 18px 60px;}
  .qrcard{background:#fff; color:#1A120E; border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; animation:fadeUp .5s both; animation-delay:calc(var(--i,0) * 60ms);}
  .qrcard img{width:100%; max-width:190px;}
  .qrcard .t{font-weight:800; margin-top:8px;}
  .table-qr-section{margin:28px 0 0;padding:20px;border:1px solid rgba(198,151,99,.27);border-radius:22px;background:rgba(255,253,249,.7);box-shadow:0 12px 32px rgba(28,18,13,.06);}
  .qrpanel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .qrpanel-head h2{color:var(--ink);font-size:clamp(19px,3vw,25px);}
  .table-qr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1000px;margin:0 auto;}
  .table-qrcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 10px;background:linear-gradient(150deg,#fff,#fbf7f0);border:1px solid rgba(198,151,99,.3);border-radius:18px;text-align:center;box-shadow:0 8px 22px rgba(28,18,13,.06);}
  .table-qrcard .table-qr-title{color:#714522;font-size:clamp(16px,2.4vw,21px);font-weight:800;}
  .table-qrcard img{width:min(100%,190px);aspect-ratio:1;object-fit:contain;padding:7px;background:#fff;border:1px solid #eee6da;}
  .table-qrcard .qr-brand{font-weight:800;color:var(--ink);font-size:13px;}
  .table-qrcard .qr-instruction{color:var(--muted);font-size:12px;}
  /* Modern luxury finish */
  body{background:radial-gradient(ellipse at 82% 0%,rgba(198,151,99,.13),transparent 34%),var(--bg);}
  nav{background:rgba(255,253,249,.82);backdrop-filter:blur(18px);border-color:rgba(198,151,99,.24);box-shadow:0 8px 30px rgba(28,18,13,.05);}
  .navbrand .logo{filter:drop-shadow(0 5px 8px rgba(28,18,13,.16));}
  .tablepill{background:linear-gradient(135deg,#2A1A12,#1C120D);box-shadow:0 5px 16px rgba(28,18,13,.18);}
  .langbtn{border-color:rgba(198,151,99,.72);color:var(--dark);}
  .langbtn:hover{background:var(--dark);color:var(--surface);}
  .hero{max-width:1120px;padding-top:58px;padding-bottom:48px;gap:clamp(28px,6vw,76px);}
  .hero h1{letter-spacing:-.035em;}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;color:#8A623E;letter-spacing:2.5px;}
  .eyebrow:before{content:"";width:28px;height:1px;background:var(--accent);}
  .hero .art{position:relative;isolation:isolate;}
  .hero .art img{position:relative;z-index:1;max-width:390px;border:7px solid rgba(255,253,249,.92);box-shadow:0 28px 70px rgba(28,18,13,.2),0 0 0 1px rgba(198,151,99,.22);}
  .hero .art:before,.hero .art:after{content:"";position:absolute;z-index:2;top:8%;width:13px;height:54px;border-radius:50%;background:linear-gradient(180deg,rgba(255,253,249,0),rgba(255,253,249,.72),rgba(255,253,249,0));filter:blur(5px);pointer-events:none;animation:steam 3.8s ease-in-out infinite;}
  .hero .art:before{left:44%;}
  .hero .art:after{left:55%;height:42px;animation-delay:1.2s;}
  @keyframes steam{0%,100%{opacity:0;transform:translate3d(0,12px,0) scale(.8);}35%{opacity:.72;}70%{opacity:.22;transform:translate3d(7px,-24px,0) scale(1.2);}}
  .cta{background:linear-gradient(135deg,#2A1A12,#1C120D);box-shadow:0 12px 28px rgba(28,18,13,.22),inset 0 1px rgba(255,255,255,.08);}
  .cta:hover{background:linear-gradient(135deg,#3b281d,#24170f);box-shadow:0 16px 34px rgba(28,18,13,.26);}
  .menu{max-width:1120px;padding-top:34px;}
  .menu h2{font-size:clamp(25px,4vw,32px);letter-spacing:-.02em;}
  .menu .sub{letter-spacing:1.5px;}
  .cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:20px;}

let revealSafetyTimer = 0;
function initScrollReveal(root){
  if(!root) return;
  if(revealObserver) revealObserver.disconnect();
  const targets = root.querySelectorAll('.hero h1,.hero .eyebrow,.hero p,.hero-actions,.hero .art,.menu h2,.menu .sub,.category-pill,.card,.pinbox,.order,.qrcard,.table-qrcard,.repcard');
  if(!targets.length) return;
  if(!revealSafetyTimer){
    revealSafetyTimer = window.setTimeout(()=>{
      document.body.classList.add('reveal-safety-visible');
      document.querySelectorAll('.reveal').forEach(el=>{
        el.classList.add('is-visible');
        if(revealObserver) revealObserver.unobserve(el);
      });
    },500);
  }
  if(!('IntersectionObserver' in window)) return;
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    });
  },{threshold:0.01,rootMargin:'0px 0px 50px 0px'});
  revealObserver = observer;
  document.body.classList.add('reveal-ready');
  targets.forEach((el,i)=>{
    el.classList.add('reveal');
    el.style.setProperty('--reveal-delay',Math.min(i%8,7)*55+'ms');
    const rect=el.getBoundingClientRect();
    if(rect.top<window.innerHeight+50 && rect.bottom>0) el.classList.add('is-visible');
    revealObserver.observe(el);
  });
}

function initLuxuryMotion(){
  const preloader = document.getElementById('preloader');
  if(preloader) setTimeout(()=>preloader.classList.add('is-hidden'),500);

  const progress = document.getElementById('scrollProgress');
  let progressFrame = 0;
  const updateProgress = ()=>{
    if(progressFrame) return;
    progressFrame = requestAnimationFrame(()=>{
      progressFrame = 0;
      if(!progress) return;
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const fraction = scrollable > 0 ? Math.min(1,Math.max(0,window.scrollY/scrollable)) : 0;
      progress.style.transform = 'scaleX('+fraction+')';
    });
  };
  window.addEventListener('scroll',updateProgress,{passive:true});
  window.addEventListener('resize',updateProgress,{passive:true});
  updateProgress();

  const app = document.getElementById('app');
  if(app && window.matchMedia('(hover: hover)').matches){
    app.addEventListener('pointermove',event=>{
      if(window.matchMedia('(hover: none), (pointer: coarse), (prefers-reduced-motion: reduce)').matches) return;
      const card = event.target.closest('.card');
      if(!card) return;
      const rect = card.getBoundingClientRect();
      const x = Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
      const y = Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));
      card.style.setProperty('--tilt-x',((.5-y)*7).toFixed(2)+'deg');
      card.style.setProperty('--tilt-y',((x-.5)*8).toFixed(2)+'deg');
    },{passive:true});
    app.addEventListener('pointerout',event=>{
      const card = event.target.closest('.card');
      if(card && !card.contains(event.relatedTarget)){
        card.style.setProperty('--tilt-x','0deg');
        card.style.setProperty('--tilt-y','0deg');
      }
    },{passive:true});
  }
}

async function applyTableLabels(root){
  const cards = root.querySelectorAll('.table-qrcard[data-table-number]');
  if(!cards.length) return;
  const errorBox = root.querySelector('#qrTableError');
  try{
    const {data,error} = await sb.from('cafe_tables')
      .select('table_number,label_ar,label_en')
      .order('table_number');
    if(error) throw error;
    const tables = new Map((data || []).map(table=>[Number(table.table_number),table]));
    cards.forEach(card=>{
      const number = Number(card.dataset.tableNumber);
      const table = tables.get(number);
      const label = table && (lang==='ar' ? table.label_ar : table.label_en);
      const standard = t('table_no') + ' ' + number;
      const labelElement = card.querySelector('.table-db-label');
      if(labelElement && label && label.trim() && label.trim() !== standard){
        labelElement.textContent = label.trim();
        labelElement.hidden = false;
      }
    });
    if(errorBox) errorBox.style.display = 'none';
  }catch(error){
    if(errorBox){
      errorBox.textContent = t('table_labels_unavailable');
      errorBox.style.display = 'block';
    }
  }

    .replace(/[أإآ]/g,'ا')

  const name = normalizeMenuText((item.name_ar || '') + ' ' + (item.name_en || ''));

}

    turkish:'turkish',oriental:'turkish',turkishcoffee:'turkish',قهوةتركي:'turkish',تركي:'turkish',شرقي:'turkish',
    espresso:'espresso',coffee:'espresso',hot:'espresso',hotdrinks:'espresso',قهوةساخنة:'espresso',ساخن:'espresso',اسبريسو:'espresso',اسبرسو:'espresso',
    specialty:'specialty',speciality:'specialty',specialtycoffee:'specialty',قهوةمختصة:'specialty',قهوةمختصه:'specialty',
    iced:'iced',icedcoffee:'iced',cold:'iced',coldcoffee:'iced',قهوةمثلجة:'iced',قهوةمثلجه:'iced',مثلج:'iced',
    tea:'tea',warm:'tea',warmdrinks:'tea',شاي:'tea',مشروباتدافئة:'tea',مشروباتدافئه:'tea',
    juice:'juice',smoothie:'juice',juices:'juice',عصائر:'juice',سموذي:'juice',
    milkshake:'milkshake',shake:'milkshake',coldbeverages:'milkshake',ميلكشيك:'milkshake',بارد:'milkshake',
    dessert:'dessert',bakery:'dessert',sweets:'dessert',حلويات:'dessert',مخبوزات:'dessert'
  };
  if(aliases[key]) return aliases[key];
  if(MENU_CATEGORIES.some(category=>category.id===key)) return key;
  return inferMenuCategory({name_ar:String(item.category || '')+' '+(item.name_ar || ''),name_en:item.name_en});
}

function bump(id){

  setTimeout(()=>el.classList.remove('bump'), 200);
}

function animateFlyToCart(id){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const source = document.getElementById('q'+id)?.closest('.card')?.querySelector('.cimg');
  const target = document.getElementById('cartTotal');
  const bar = document.getElementById('cartbar');
  if(!source || !target || !bar) return;
  const from = source.getBoundingClientRect();
  const to = target.getBoundingClientRect();
  const dot = document.createElement('span');
  dot.className = 'fly-dot';
  dot.style.left=(from.left+from.width/2)+'px';
  dot.style.top=(from.top+from.height/2)+'px';
  document.body.appendChild(dot);
  const dx=to.left+to.width/2-(from.left+from.width/2);
  const dy=Math.min(to.top+to.height/2,window.innerHeight-24)-(from.top+from.height/2);
  if(dot.animate){
    const animation=dot.animate([
      {transform:'translate3d(0,0,0) scale(1)',opacity:1},
      {transform:'translate3d('+dx+'px,'+dy+'px,0) scale(.12)',opacity:0}
    ],{duration:620,easing:'cubic-bezier(.18,.72,.24,1)'});
    animation.onfinish=()=>dot.remove();
  }else dot.remove();
  bar.classList.remove('cart-pop');
  target.classList.remove('cart-pop-number');
  void bar.offsetWidth;
  bar.classList.add('cart-pop');
  target.classList.add('cart-pop-number');
  setTimeout(()=>{bar.classList.remove('cart-pop');target.classList.remove('cart-pop-number');},600);
}

function chQty(id, d){
  CART[id] = Math.max(0, (CART[id]||0) + d);
  const el = document.getElementById('q'+id);
  if(el) el.textContent = CART[id];
  bump(id);
  refreshCart();
  if(d>0) animateFlyToCart(id);
}

function refreshCart(){
  let total = 0, count = 0;
  MENU.forEach(m=>{ const q = CART[m.id]||0; total += q * Number(m.price); count += q; });
  const bar = document.getElementById('cartbar');
  bar.classList.toggle('show', count > 0);
  document.getElementById('cartTotal').textContent = total + ' ' + t('egp');
}

let cashierOK = false, cashierPin = '', liveOrders = {}, prevOrderIds = new Set(), pollTimer = null;

function unlockOrderAudio(){
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if(!AudioContextClass) return;
  if(!alertAudioContext) alertAudioContext = new AudioContextClass();
  if(alertAudioContext.state === 'suspended') alertAudioContext.resume().catch(()=>{});
}

function playOrderAlert(){
  if(!alertAudioContext || alertAudioContext.state !== 'running') return;
  const now = alertAudioContext.currentTime;
  const oscillator = alertAudioContext.createOscillator();
  const gain = alertAudioContext.createGain();
  oscillator.type = 'sine';
  oscillator.frequency.setValueAtTime(740, now);
  oscillator.frequency.setValueAtTime(880, now + 0.11);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.14, now + 0.025);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
  oscillator.connect(gain);
  gain.connect(alertAudioContext.destination);
  oscillator.start(now);
  oscillator.stop(now + 0.29);
}

async function cafeCall(pin, action, extra){
  const {data, error} = await sb.rpc('cafe_api', {
    p_pin: pin,
    p_action: action,
    p_payload: extra || {}
  });
  if(error) throw error;
  if(!data || typeof data !== 'object') throw new Error('Invalid response from cafe_api');
  return data;
}

async function cashierCall(action, extra){
  return cafeCall(cashierPin, action, extra);
}

function normalizePinDigits(value){
  return String(value || '').replace(/[٠-٩۰-۹]/g, digit=>{
    const code = digit.charCodeAt(0);
    return String.fromCharCode(code >= 0x06F0 ? 48 + code - 0x06F0 : 48 + code - 0x0660);
  });
}

function bindPinDigitNormalization(input){
  input.addEventListener('input',()=>{
    const normalized = normalizePinDigits(input.value);
    if(normalized === input.value) return;
    const position = input.selectionStart;
    input.value = normalized;
    if(position !== null) input.setSelectionRange(position,position);
  });
}

async function tryPin(){
  unlockOrderAudio();
  const pinInput = document.getElementById('pinIn');
  const v = normalizePinDigits(pinInput.value.trim());
  pinInput.value = v;
  cashierPin = v;
  let ok = false, serviceUnavailable = false;
  try{
    const r = await cashierCall('ping');
    ok = r && r.ok && r.role === 'cashier';
  }catch(e){ ok = false; serviceUnavailable = true; }
  if(ok){ cashierOK = true; renderCashier(); return; }
  cashierPin = '';
  const e = document.getElementById('pinErr');
  e.textContent = t(serviceUnavailable?'auth_unavailable':'pin_wrong');
  e.style.display = 'block';
}

function startPolling(){ stopPolling(); pollTimer = setInterval(loadOrders, 12000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

async function loadOrders(){
  let r;
  try{ r = await cashierCall('orders'); }
  catch(e){
    const errorBox = document.getElementById('cashierError');
    if(errorBox){ errorBox.textContent = t('backend_error'); errorBox.style.display = 'block'; }
    return;
  }
  const errorBox = document.getElementById('cashierError');
  if(errorBox) errorBox.style.display = 'none';
  if(!r || !r.ok || !Array.isArray(r.orders)){
    if(errorBox){ errorBox.textContent = t('backend_error'); errorBox.style.display = 'block'; }
    return;
  }
  const items = r.items || [];
  const fresh = {};
  const hasNewOrders = hasLoadedOrders && r.orders.some(o=>!prevOrderIds.has(o.id));
  for(const o of r.orders){
    o._items = items.filter(i=>i.order_id===o.id);
    o._flash = hasLoadedOrders && !prevOrderIds.has(o.id);
    fresh[o.id] = o;
  }
  prevOrderIds = new Set(r.orders.map(o=>o.id));
  liveOrders = fresh;
  hasLoadedOrders = true;
  drawOrders();
  if(hasNewOrders) playOrderAlert();
}

async function setStatus(id, status){
  try{
    const result = await cashierCall('set_status', {id: id, status: status});
    if(!result || !result.ok) throw new Error('Order status update was rejected');
    loadOrders();
  }catch(e){
    const errorBox = document.getElementById('cashierError');
    if(errorBox){ errorBox.textContent = t('backend_error'); errorBox.style.display = 'block'; }
  }
}

const CAFE_REPORT_TIME_ZONE = 'Africa/Cairo';
const cairoDateFormatter = new Intl.DateTimeFormat('en-GB', {
  timeZone: CAFE_REPORT_TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit'
});

function cairoDateKey(date){
  const parts = cairoDateFormatter.formatToParts(date);
  const part = type=>parts.find(value=>value.type===type).value;
  return `${part('year')}-${part('month')}-${part('day')}`;
}

function startOfCairoDate(dateKey){
  const [year, month, day] = dateKey.split('-').map(Number);
  const approximate = Date.UTC(year, month - 1, day);
  const step = 15 * 60 * 1000;
  let previousTime = approximate - 36 * 60 * 60 * 1000;
  let previousKey = cairoDateKey(new Date(previousTime));
  const rangeEnd = approximate + 36 * 60 * 60 * 1000;

  for(let time = previousTime + step; time <= rangeEnd; time += step){
    const currentKey = cairoDateKey(new Date(time));
    if(currentKey === dateKey && previousKey !== dateKey){
      let low = previousTime, high = time;
      while(high - low > 1){
        const middle = low + Math.floor((high - low) / 2);
        if(cairoDateKey(new Date(middle)) === dateKey) high = middle;
        else low = middle;
      }
      return new Date(high);
    }
    previousTime = time;
    previousKey = currentKey;
  }
  throw new Error('تعذر حساب بداية يوم القاهرة.');
}

function cairoDayRange(now = new Date()){
  const todayKey = cairoDateKey(now);
  const [year, month, day] = todayKey.split('-').map(Number);
  const nextDay = new Date(Date.UTC(year, month - 1, day + 1, 12));
  const nextKey = cairoDateKey(nextDay);
  return {
    time_zone: CAFE_REPORT_TIME_ZONE,
    start_at: startOfCairoDate(todayKey).toISOString(),
    end_at: startOfCairoDate(nextKey).toISOString()
  };
}

async function renderReport(){
  const body = document.getElementById('adminBody');
  if(!body) return;
  body.innerHTML = `<div class="center"><p>${t('rep_loading')}</p></div>`;
  let report;
  try{ report = await adminCall('report', cairoDayRange()); }
  catch(e){
    body.innerHTML = `<div class="center"><p>${t('backend_error')}</p></div>`;
    return;
  }
  if(!report || !report.today){
    body.innerHTML = `<div class="center"><p>${t('backend_error')}</p></div>`;
    return;
  }
  const tables = Object.entries(report.by_table || {}).sort((a,b)=> b[1].total - a[1].total);
  const hours = Object.entries(report.by_hour || {}).sort((a,b)=> Number(a[0]) - Number(b[0]));
  const maxHour = Math.max(1, ...hours.map(hour=> hour[1].total));
  let tableRows = tables.map(([number, value])=>
    `<div class="reprow"><span>${t('table')} ${number}</span><span>${value.orders} ${t('orders_count')}</span><b>${value.total} ${t('egp')}</b></div>`).join('');
  if(!tableRows) tableRows = `<div class="reprow"><span>${t('rep_empty')}</span></div>`;
  let bars = hours.map(([hour, value], i)=>{
    const percent = Math.max(6, Math.round(value.total / maxHour * 100));
    return `<div class="barcol"><div class="bar" style="height:${percent}%; --i:${i}" title="${value.total} ${t('egp')}"></div><small>${hour}:00<br>${value.total}</small></div>`;
  }).join('');
  if(!bars) bars = `<div class="empty">${t('rep_empty')}</div>`;
  body.innerHTML = `
    <div class="repcards">
      <div class="repcard"><div class="rv">${report.today.total} ${t('egp')}</div><div class="rl">${t('today')} — ${report.today.orders} ${t('orders_count')}</div></div>
      <div class="repcard"><div class="rv">${report.last_hour.total} ${t('egp')}</div><div class="rl">${t('last_hour')} — ${report.last_hour.orders} ${t('orders_count')}</div></div>
      <div class="repcard"><div class="rv">${report.avg_order} ${t('egp')}</div><div class="rl">${t('avg_order')}</div></div>
    </div>
    <div class="repsec"><h3>${t('per_table')}</h3>${tableRows}</div>
    <div class="repsec"><h3>${t('per_hour')}</h3><div class="bars">${bars}</div></div>`;
  initScrollReveal(body);
}

async function renderMenuAdmin(){
  const body = document.getElementById('adminBody');
  if(!body) return;
  body.innerHTML = `<div class="center"><p>${t('menu_loading')}</p></div>`;
  let response;
  try{ response = await adminCall('menu_list'); }
  catch(e){
    body.innerHTML = `<div class="center"><p>${t('backend_error')}</p></div>`;
    return;
  }
  if(!response || !response.ok || !Array.isArray(response.items)){
    body.innerHTML = `<div class="center"><p>${t('backend_error')}</p></div>`;
    return;
  }
  adminMenu = response.items;
  const rows = adminMenu.map(item=>`
    <div class="mrow">
      <div class="minfo"><b>${esc(item.name_ar)}</b><span>${esc(item.name_en)}</span></div>
      <div class="mprice2">${item.price} ${t('egp')}</div>
      <div class="mstat ${item.active?'on':''}">${item.active ? t('active_l') : t('inactive_l')}</div>
      <div class="mbtns">
        <button class="chipbtn" onclick="openMenuForm(${item.id})">✏️ ${t('edit')}</button>
        <button class="chipbtn danger" onclick="menuDelete(${item.id})">🗑️</button>
      </div>
    </div>`).join('');
  body.innerHTML = `<button class="cta" style="width:100%;margin-bottom:14px" onclick="openMenuForm(null)">➕ ${t('add_item')}</button>
    <div class="repsec menuadmin">${rows || '<div class="empty">'+t('rep_empty')+'</div>'}</div>
    <div class="livehint">${t('photo_hint')}</div>`;
  initScrollReveal(body);
}

function openMenuForm(id){
  const item = id ? adminMenu.find(entry=>entry.id===id) : null;
  const overlay = document.getElementById('modal');
  overlay.innerHTML = `<div class="mcard" style="text-align:start">
    <button class="mclose" onclick="closeModal()">×</button>
    <h3 style="text-align:center;color:var(--ink);margin-bottom:12px">${item ? t('edit') : t('add_item')}</h3>
    <label class="flabel">${t('nm_ar')}</label><input class="finput" id="f_ar" value="${item ? esc(item.name_ar) : ''}">
    <label class="flabel">${t('nm_en')}</label><input class="finput" id="f_en" value="${item ? esc(item.name_en) : ''}">
    <label class="flabel">${t('price_l')}</label><input class="finput" id="f_pr" type="number" min="0" step="0.5" value="${item ? item.price : ''}">
    <label class="flabel">${t('sort_l')}</label><input class="finput" id="f_so" type="number" min="0" step="1" value="${item ? item.sort_order : (adminMenu.length + 1) * 10}">
    <label class="fcheck"><input type="checkbox" id="f_ac" ${!item || item.active ? 'checked' : ''}> ${t('active_l')}</label>
    <button class="cta" style="width:100%;margin-top:16px" onclick="menuSave(${item ? item.id : 'null'})">${t('save')}</button>
  </div>`;
  overlay.classList.remove('closing');
  overlay.classList.add('open');
  overlay.onclick = event=>{ if(event.target===overlay) closeModal(); };
}

async function menuSave(id){
  const item = {
    name_ar: document.getElementById('f_ar').value.trim(),
    name_en: document.getElementById('f_en').value.trim(),
    price: Number(document.getElementById('f_pr').value) || 0,
    sort_order: Number(document.getElementById('f_so').value) || 0,
    active: document.getElementById('f_ac').checked
  };
  if(!item.name_ar || !item.name_en) return;
  if(id) item.id = id;
  try{
    const result = await adminCall('menu_save', {item: item});
    if(!result || !result.ok) throw new Error('Menu update was rejected');
  }catch(e){
    showAdminError();
    return;
  }
  closeModal(true);
  renderMenuAdmin();
}

async function menuDelete(id){
  if(!confirm(t('del_confirm'))) return;
  try{
    const result = await adminCall('menu_delete', {id: id});
    if(!result || !result.ok) throw new Error('Menu deletion was rejected');
  }catch(e){
    showAdminError();
    return;
  }
  renderMenuAdmin();
}

function drawOrders(){
  const list = document.getElementById('ordersList');
  if(!list) return;
  const arr = Object.values(liveOrders).sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  if(!arr.length){ list.innerHTML = `<div class="empty">${t('no_orders')}</div>`; return; }
  let html = '';
  for(const o of arr){
    const time = new Intl.DateTimeFormat(lang==='ar'?'ar-EG':'en-GB',{
      timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit'
    }).format(new Date(o.created_at));
    const st = o.status==='ready' ? `<span class="badge ready">${t('st_ready')}</span>` : `<span class="badge">${t('st_new')}</span>`;
    let lines = '';
    (o._items||[]).forEach(i=>{
      const nm = lang==='ar' ? i.name_ar : i.name_en;
      lines += `${i.qty} × ${nm} <span>(${i.qty * Number(i.unit_price)} ${t('egp')})</span><br>`;
    });
    const btns = o.status==='new'
      ? `<button class="btn-ready" onclick="setStatus('${o.id}','ready')">${t('btn_ready')}</button>
         <button class="btn-paid" onclick="setStatus('${o.id}','paid')">${t('btn_paid')}</button>`
      : `<button class="btn-paid" onclick="setStatus('${o.id}','paid')">${t('btn_paid')}</button>`;
    html += `<div class="order ${o.status} ${o._flash ? 'newflash' : ''}">
      <div class="head"><span class="tnum">${t('table_no')} ${o.table_number}</span> ${st} <span class="time">${time}</span></div>
      <div class="lines">${lines}</div>
      <div class="ototal">${t('total')}: ${o.total} ${t('egp')}</div>
      <div class="actions">${btns}</div>
    </div>`;
    o._flash = false;
  }
  list.innerHTML = html;
  initScrollReveal(list);
}
